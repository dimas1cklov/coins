<!doctype html>
<!-- Coin Shot: open as .html in a browser. Chest images are embedded (base64 WebP). -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Coin Shot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=TikTok+Sans:opsz,wght@12..36,300..900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body,html{margin:0;width:100%;height:100%;height:100dvh;background:#f1f1f2;overflow:hidden}
body{display:flex;align-items:center;justify-content:center;position:fixed;inset:0}
#stage{width:390px;height:844px;position:relative;transform-origin:center center;flex:none}
#app{width:390px;height:844px;position:relative;overflow:hidden;background:#fff;font-family:'TikTok Sans',system-ui,sans-serif;color:#161823;user-select:none;-webkit-user-select:none;border-radius:28px}
.abs{position:absolute}
.hidden{display:none!important}
button,input{font-family:'TikTok Sans',system-ui,sans-serif}
.glitch{text-shadow:-2px -1px 0 rgba(37,244,238,.9),2px 1px 0 rgba(254,44,85,.9)}
.glitch-soft{text-shadow:-1px -1px 0 rgba(37,244,238,.85),1px 1px 0 rgba(254,44,85,.85)}
.dots{background-image:radial-gradient(#e9e9eb 1.2px,transparent 1.4px);background-size:22px 22px}
#game{inset:0;touch-action:none;cursor:grab}
#hud{left:0;top:0;width:100%;padding:20px 20px 0;display:flex;flex-direction:column;gap:14px;pointer-events:none}
.row{display:flex;align-items:center;justify-content:space-between}
.pill{display:flex;align-items:center;gap:6px;background:#f1f1f2;border-radius:999px;padding:6px 14px 6px 6px}
.hitdot{width:22px;height:22px;border-radius:50%;border:2px dashed #c4c4c8;display:flex;align-items:center;justify-content:center}
.hitdot svg{display:none}
.hitdot.on{background:#fe2c55;border:0}
.hitdot.on svg{display:block}
#chest{left:0;top:0;width:172px;height:182px;pointer-events:none;will-change:transform}
#chestShadow{left:18px;top:152px;width:136px;height:20px;border-radius:50%;background:rgba(22,24,35,.1)}
#chestImg{left:0;top:0;width:172px;height:163px;transform-origin:50% 100%}
#pop{left:0;top:0;width:100px;text-align:center;font-size:26px;font-weight:900;pointer-events:none}
#miss{left:0;top:350px;width:390px;text-align:center;font-size:22px;font-weight:800;color:#6b6c72;pointer-events:none}
#sling{left:0;top:0;pointer-events:none}
#coin{left:0;top:0;width:94px;height:94px;pointer-events:none;filter:drop-shadow(0 4px 6px rgba(22,24,35,.25));will-change:transform}
#hint{left:0;bottom:70px;width:100%;display:flex;justify-content:center;pointer-events:none;transition:opacity .25s}
#hint>div{display:flex;align-items:center;gap:8px;background:#161823;color:#fff;font-size:14px;font-weight:700;padding:9px 16px;border-radius:999px}
.backdrop{inset:0;background:rgba(22,24,35,.5);animation:fadeIn .3s ease both}
.sheet{left:0;bottom:0;width:100%;background:#fff;border-radius:24px 24px 0 0;padding:12px 24px 34px;display:flex;flex-direction:column;align-items:center;animation:sheetUp .45s cubic-bezier(.2,.9,.25,1) both}
.grab{width:40px;height:4px;border-radius:2px;background:#e3e3e4;margin-bottom:8px}
.amount{animation:popIn .6s .25s cubic-bezier(.2,.9,.25,1.2) both}
.floaty{animation:floaty 2.4s ease-in-out infinite}
.rays{background:repeating-conic-gradient(from 0deg,#ffe9a8 0deg 10deg,transparent 10deg 24deg);border-radius:50%;animation:spin 14s linear infinite}
.nickfield{display:flex;align-items:center;gap:8px;height:52px;border:1.5px solid #e3e3e4;border-radius:8px;background:#f8f8f8;padding:0 6px 0 14px}
.nickfield:focus-within{border-color:#161823}
#nick{flex:1;min-width:0;border:0;background:0 0;font-size:17px;font-weight:600;color:#161823;height:44px;padding:0;outline:0}
#paste{height:40px;padding:0 14px;border:0;border-radius:6px;background:#fff;box-shadow:0 0 0 1px #e3e3e4;color:#fe2c55;font-size:15px;font-weight:800;cursor:pointer}
#paste:active{transform:scale(.95)}
#claim{width:100%;height:52px;margin-top:16px;border:0;border-radius:8px;background:#fe2c55;color:#fff;font-size:17px;font-weight:800;cursor:pointer}
#claim:disabled{opacity:.4;cursor:not-allowed}
#claim:not(:disabled):active{transform:scale(.98)}
#loading{inset:0;background:rgba(255,255,255,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;animation:fadeIn .3s ease both}
.tk{position:absolute;top:2px;width:20px;height:20px;border-radius:50%;mix-blend-mode:multiply}
.tkA{left:0;background:#25f4ee;animation:tkA .9s ease-in-out infinite}
.tkB{left:22px;background:#fe2c55;animation:tkB .9s ease-in-out infinite}
#done{inset:0;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 24px;animation:fadeIn .3s ease both}
#confetti{inset:0;overflow:hidden;pointer-events:none}
.cf{position:absolute;top:-24px;animation-timing-function:linear;animation-iteration-count:infinite}
.cfA{animation-name:cfA}.cfB{animation-name:cfB}.cfC{animation-name:cfC}
.chestshake{animation:shake .45s ease-in-out both}
.lid3d{perspective:520px}
.lidfront{transform-origin:50% 100%;backface-visibility:hidden;animation:lidBack .32s .45s cubic-bezier(.5,0,.9,.6) both}
.lidinner{transform-origin:50% 100%;animation:lidUp .55s .77s cubic-bezier(.2,1.3,.4,1) both}
.mound{animation:moundUp .6s .7s cubic-bezier(.2,.9,.3,1) both}
.glow{animation:glowIn .6s .5s ease-out both}
.burst{position:absolute;left:112px;top:70px;width:36px;height:36px;animation-duration:1.1s;animation-delay:.6s;animation-timing-function:cubic-bezier(.2,.7,.4,1);animation-fill-mode:both}
.b1{animation-name:b1}.b2{animation-name:b2;animation-delay:.68s}.b3{animation-name:b3;animation-delay:.62s}.b4{animation-name:b4;animation-delay:.72s}.b5{animation-name:b5;animation-delay:.65s}
#again{margin-top:24px;height:48px;padding:0 32px;border:0;border-radius:8px;background:#f1f1f2;color:#161823;font-size:16px;font-weight:800;cursor:pointer}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes popIn{0%{transform:scale(.3);opacity:0}60%{transform:scale(1.15);opacity:1}100%{transform:scale(1)}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes tkA{0%,100%{transform:translateX(0) scale(1)}50%{transform:translateX(20px) scale(.8)}}
@keyframes tkB{0%,100%{transform:translateX(0) scale(.8)}50%{transform:translateX(-20px) scale(1)}}
@keyframes cfA{0%{transform:translateY(-30px) rotate(0)}100%{transform:translateY(900px) rotate(540deg)}}
@keyframes cfB{0%{transform:translateY(-30px) rotate(0) translateX(0)}50%{transform:translateY(430px) rotate(-200deg) translateX(24px)}100%{transform:translateY(900px) rotate(-420deg) translateX(-10px)}}
@keyframes cfC{0%{transform:translateY(-30px) rotateX(0) rotate(20deg)}100%{transform:translateY(900px) rotateX(720deg) rotate(200deg)}}
@keyframes shake{0%,100%{transform:rotate(0)}20%{transform:rotate(-5deg)}40%{transform:rotate(5deg)}60%{transform:rotate(-4deg)}80%{transform:rotate(3deg)}}
@keyframes lidBack{0%{transform:rotateX(0)}100%{transform:rotateX(90deg)}}
@keyframes lidUp{0%{transform:rotateX(90deg)}100%{transform:rotateX(14deg)}}
@keyframes moundUp{0%{transform:translateY(26px);opacity:0}30%{opacity:1}100%{transform:translateY(0);opacity:1}}
@keyframes glowIn{0%{transform:scale(.2);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes b1{0%{transform:translate(0,0) scale(.4);opacity:0}15%{opacity:1}100%{transform:translate(-110px,-60px) scale(1) rotate(-200deg);opacity:0}}
@keyframes b2{0%{transform:translate(0,0) scale(.4);opacity:0}15%{opacity:1}100%{transform:translate(-60px,-140px) scale(1) rotate(160deg);opacity:0}}
@keyframes b3{0%{transform:translate(0,0) scale(.4);opacity:0}15%{opacity:1}100%{transform:translate(4px,-170px) scale(1.1) rotate(-120deg);opacity:0}}
@keyframes b4{0%{transform:translate(0,0) scale(.4);opacity:0}15%{opacity:1}100%{transform:translate(66px,-140px) scale(1) rotate(200deg);opacity:0}}
@keyframes b5{0%{transform:translate(0,0) scale(.4);opacity:0}15%{opacity:1}100%{transform:translate(115px,-56px) scale(1) rotate(-180deg);opacity:0}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="coinSym" viewBox="0 0 34 34">
    <image href="https://cdn.imagetourls.com/uploads/tyImg/Q1dN0SKZ.png" width="34" height="34" preserveAspectRatio="xMidYMid meet"/>
  </symbol>
</svg>

<div id="stage">
  <div id="app">
    <div id="game" class="abs dots">
      <div id="hud" class="abs">
        <div class="row">
          <div class="glitch" style="font-size:28px;font-weight:900;letter-spacing:-.5px">Coin Shot</div>
          <div class="pill">
            <svg width="24" height="24" aria-hidden="true"><use href="#coinSym"/></svg>
            <span id="earned" style="font-size:17px;font-weight:800">0</span>
          </div>
        </div>
        <div class="row">
          <div style="font-size:15px;font-weight:600;color:#6b6c72">Hit the chest 3 times</div>
          <div id="hitDots" style="display:flex;gap:8px">
            <div class="hitdot"><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 6.2l2.3 2.3 4.7-5" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
            <div class="hitdot"><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 6.2l2.3 2.3 4.7-5" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
            <div class="hitdot"><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 6.2l2.3 2.3 4.7-5" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
          </div>
        </div>
      </div>

      <div id="chest" class="abs">
        <div id="chestShadow" class="abs"></div>
        <img id="chestImg" class="abs" alt="Treasure chest" draggable="false">
      </div>

      <div id="pop" class="abs glitch-soft hidden">+0</div>
      <div id="miss" class="abs hidden">Miss! Try again</div>

      <svg id="sling" class="abs" width="390" height="844" viewBox="0 0 390 844" aria-hidden="true">
        <ellipse cx="195" cy="812" rx="120" ry="16" fill="#F1F1F2"/>
        <g id="aim"></g>
        <line id="bandL" x1="150" y1="638" x2="195" y2="676" stroke="#25F4EE" stroke-width="7" stroke-linecap="round"/>
        <path d="M195 812 L195 716 M195 716 L150 638 M195 716 L240 638" fill="none" stroke="#6E4120" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M195 808 L195 716 M195 716 L152 641 M195 716 L238 641" fill="none" stroke="#A9703F" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="183" y="750" width="24" height="10" rx="3" fill="#161823"/>
        <rect x="183" y="766" width="24" height="10" rx="3" fill="#161823"/>
        <line id="bandR" x1="240" y1="638" x2="195" y2="676" stroke="#FE2C55" stroke-width="7" stroke-linecap="round"/>
        <rect id="pouch" x="165" y="666" width="60" height="20" rx="10" fill="#161823"/>
      </svg>

      <div id="coin" class="abs">
        <svg width="94" height="94" aria-hidden="true"><use href="#coinSym"/></svg>
      </div>

      <div id="hint" class="abs">
        <div>
          <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M4 9l4 4 4-4" fill="none" stroke="#25F4EE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Pull back &amp; release to shoot
        </div>
      </div>
    </div>

    <div id="reward" class="hidden">
      <div class="abs backdrop"></div>
      <div class="abs sheet">
        <div class="grab"></div>
        <div style="position:relative;width:220px;height:190px;display:flex;align-items:center;justify-content:center">
          <div class="rays" style="position:absolute;left:15px;top:0;width:190px;height:190px;opacity:.9"></div>
          <img id="sheetChest" class="floaty" alt="Treasure chest" draggable="false" style="position:relative;width:150px;height:142px">
        </div>
        <div class="glitch-soft" style="font-size:22px;font-weight:800;margin-top:6px">Boom! You won</div>
        <div class="amount" style="display:flex;align-items:center;gap:10px;margin-top:6px">
          <svg width="40" height="40" aria-hidden="true"><use href="#coinSym"/></svg>
          <span id="rewardAmount" class="glitch" style="font-size:52px;font-weight:900;letter-spacing:-1px;line-height:1">0</span>
        </div>
        <div style="font-size:15px;font-weight:600;color:#6b6c72;margin-top:4px">coins</div>
        <div style="width:100%;display:flex;flex-direction:column;gap:8px;margin-top:22px">
          <label for="nick" style="font-size:15px;font-weight:700">Enter your nickname</label>
          <div class="nickfield">
            <span style="font-size:17px;font-weight:700;color:#6b6c72">@</span>
            <input id="nick" autocomplete="off" spellcheck="false" placeholder="nickname">
            <button id="paste" type="button">Paste</button>
          </div>
        </div>
        <button id="claim" type="button" disabled>Claim</button>
      </div>
    </div>

    <div id="loading" class="abs hidden">
      <div style="position:relative;width:44px;height:24px">
        <div class="tk tkA"></div>
        <div class="tk tkB"></div>
      </div>
      <div style="font-size:17px;font-weight:700">Claiming for @<span id="loadNick"></span>…</div>
    </div>

    <div id="done" class="abs hidden">
      <div id="confetti" class="abs" aria-hidden="true"></div>
      <div style="position:relative;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center">
        <div class="glitch amount" style="font-size:40px;font-weight:900;letter-spacing:-1px;animation-delay:0s">Congratulations!</div>
        <div class="chestshake" role="img" aria-label="Open treasure chest full of coins" style="position:relative;width:260px;height:200px;margin-top:4px">
          <div class="glow" style="position:absolute;left:20px;top:-20px;width:220px;height:220px"><div class="rays" style="width:220px;height:220px"></div></div>
          <div class="glow" style="position:absolute;left:70px;top:78px;width:120px;height:34px;border-radius:50%;background:#fff1b8;filter:blur(12px)"></div>
          <div class="lid3d" style="position:absolute;left:49px;top:30px;width:162px;height:72px">
            <svg class="lidinner" width="162" height="72" viewBox="0 0 162 72" aria-hidden="true" style="position:absolute;left:0;top:0">
              <path d="M4 72 L4 30 C4 12 16 4 30 4 L132 4 C146 4 158 12 158 30 L158 72 Z" fill="#F6D08A"></path>
              <path d="M14 72 L14 32 C14 20 22 14 32 14 L130 14 C140 14 148 20 148 32 L148 72 Z" fill="#9E1F3A"></path>
              <path d="M14 72 L14 32 C14 20 22 14 32 14 L130 14 C140 14 148 20 148 32 L148 44 C120 36 42 36 14 44 Z" fill="#7C1730"></path>
              <rect x="68" y="4" width="26" height="68" fill="#F6D08A"></rect>
              <rect x="68" y="4" width="4" height="68" fill="#E8B866"></rect>
            </svg>
          </div>
          <div style="position:absolute;left:52px;top:100px;width:156px;height:26px;border-radius:50%;background:#5b1b2a"></div>
          <svg class="mound" width="150" height="62" viewBox="0 0 150 62" aria-hidden="true" style="position:absolute;left:55px;top:70px">
            <use href="#coinSym" x="54" y="6" width="24" height="24"/>
            <use href="#coinSym" x="74" y="5" width="24" height="24"/>
            <use href="#coinSym" x="38" y="13" width="24" height="24"/>
            <use href="#coinSym" x="58" y="12" width="26" height="26"/>
            <use href="#coinSym" x="80" y="13" width="25" height="25"/>
            <use href="#coinSym" x="96" y="16" width="23" height="23"/>
            <use href="#coinSym" x="22" y="21" width="24" height="24"/>
            <use href="#coinSym" x="40" y="21" width="25" height="25"/>
            <use href="#coinSym" x="60" y="20" width="26" height="26"/>
            <use href="#coinSym" x="81" y="21" width="26" height="26"/>
            <use href="#coinSym" x="102" y="22" width="24" height="24"/>
            <use href="#coinSym" x="8" y="30" width="24" height="24"/>
            <use href="#coinSym" x="25" y="29" width="25" height="25"/>
            <use href="#coinSym" x="44" y="29" width="26" height="26"/>
            <use href="#coinSym" x="63" y="28" width="27" height="27"/>
            <use href="#coinSym" x="84" y="29" width="26" height="26"/>
            <use href="#coinSym" x="104" y="29" width="25" height="25"/>
            <use href="#coinSym" x="120" y="31" width="24" height="24"/>
            <use href="#coinSym" x="0" y="37" width="24" height="24"/>
            <use href="#coinSym" x="18" y="37" width="25" height="25"/>
            <use href="#coinSym" x="36" y="37" width="25" height="25"/>
            <use href="#coinSym" x="54" y="37" width="26" height="26"/>
            <use href="#coinSym" x="73" y="37" width="26" height="26"/>
            <use href="#coinSym" x="92" y="37" width="26" height="26"/>
            <use href="#coinSym" x="110" y="37" width="25" height="25"/>
            <use href="#coinSym" x="126" y="38" width="24" height="24"/>
            <path d="M128 22l1.6 4 4 1.6-4 1.6-1.6 4-1.6-4-4-1.6 4-1.6z" fill="#FFFFFF"></path>
            <path d="M30 26l1.2 3 3 1.2-3 1.2-1.2 3-1.2-3-3-1.2 3-1.2z" fill="#FFFFFF"></path>
          </svg>
          <img id="bodyImg" alt="" draggable="false" style="position:absolute;left:45px;top:112px;width:170px;height:81px">
          <div class="lid3d" style="position:absolute;left:45px;top:31px;width:170px;height:82px">
            <img id="lidImg" class="lidfront" alt="" draggable="false" style="position:absolute;left:0;top:0;width:170px;height:82px">
          </div>
          <svg class="burst b1" aria-hidden="true"><use href="#coinSym"/></svg>
          <svg class="burst b2" aria-hidden="true"><use href="#coinSym"/></svg>
          <svg class="burst b3" aria-hidden="true"><use href="#coinSym"/></svg>
          <svg class="burst b4" aria-hidden="true"><use href="#coinSym"/></svg>
          <svg class="burst b5" aria-hidden="true"><use href="#coinSym"/></svg>
        </div>
        <div style="display:flex;align-items:center;gap:10px">
          <svg width="44" height="44" aria-hidden="true"><use href="#coinSym"/></svg>
          <span id="count" class="glitch" style="font-size:60px;font-weight:900;letter-spacing:-1.5px;line-height:1;font-variant-numeric:tabular-nums">0</span>
        </div>
        <div style="font-size:17px;font-weight:600;color:#6b6c72">coins added to <span id="doneNick" style="color:#161823;font-weight:800"></span></div>
        <button id="again" type="button">Play again</button>
      </div>
    </div>
  </div>
